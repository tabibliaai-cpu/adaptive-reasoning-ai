[build]
  command = "npm run build"
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[functions]
  node_bundler = "esbuild"
  included_files = ["node_modules/**"]

# API route: /api/reason — give it max timeout for the reasoning pipeline
# Netlify Pro: 26 seconds, Netlify free: 10 seconds
[[headers]]
  for = "/api/*"
  [headers.values]
    Cache-Control = "no-cache, no-transform"
    X-Accel-Buffering = "no"
